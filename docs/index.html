<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tankpreise">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Tankpreise Uhingen</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--fg:#1c1c1e;--muted:#6e6e73;--line:#e5e5ea;
  --acc:#0a7cff;--good:#1a9f4a;--good-bg:#e3f6e9;--bad:#d93025;--bad-bg:#fde8e6;--seg:#e3e3e8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--fg:#f2f2f7;--muted:#98989f;--line:#2c2c2e;
  --acc:#3d9bff;--good:#3ddc84;--good-bg:#0f2e1b;--bad:#ff6b5e;--bad-bg:#3a1512;--seg:#2c2c2e;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:640px;margin:0 auto;overscroll-behavior-y:contain}
body.lock{overflow:hidden}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:30px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
#stand{white-space:pre-line}
h2{font-size:20px;margin:28px 4px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 .sub{font-weight:400}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.iconbtn{background:var(--card);color:var(--acc);width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:2px;margin:8px 0 16px}
.seg button{flex:1;padding:7px 0;border-radius:8px;background:none;font-size:15px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--acc);color:#fff}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.hero .label{color:var(--muted);font-size:14px}
.hero .price{font-size:52px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.hero .price sup{font-size:26px}
.hero .where{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row.two{flex-wrap:nowrap}.row.two .btn{flex:1}
.stats .pill{font-size:12px;margin-top:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--seg);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.secondary{background:var(--seg);color:var(--acc)}
.btn.block{width:100%}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .emoji{font-size:24px;line-height:1}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;width:100%;background:none;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--seg)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .addr{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p{text-align:right;font-variant-numeric:tabular-nums}
.item .p b{font-size:20px} .item .p b sup{font-size:12px}
.item .d{font-size:12px;color:var(--muted)}
.item.closed{opacity:.45}
.item.best .p b{color:var(--good)}
.chev{color:var(--muted);flex:none}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.gl{stroke:var(--line)} .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
.ln2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;stroke-linejoin:round}
.bar-up{fill:var(--bad);opacity:.55} .bar-down{fill:var(--good);opacity:.55} .bar-best{fill:var(--good)} .bar-now{stroke:var(--fg);stroke-width:1.5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--acc);vertical-align:middle;margin-right:5px}
.legend i.dash{border-top:2px dashed var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0} .stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:608px;margin:0 auto;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;transform:translateY(150%);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s;z-index:50}
.toast.show{transform:none;opacity:1;visibility:visible}
/* Ziehen zum Aktualisieren */
#ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 4px);display:grid;place-items:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .2s}
#ptr div{width:36px;height:36px;border-radius:18px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;color:var(--acc)}
#ptr svg{width:20px;height:20px}
/* Detailansicht */
#detail{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(100%);transition:transform .28s ease;visibility:hidden}
#detail.open{transform:none;visibility:visible}
#detail .wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.back{background:none;color:var(--acc);font-size:17px;padding:8px 0;display:inline-flex;align-items:center;gap:4px}
.dhead h1{font-size:28px;margin-top:4px}
.fuelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.ftile{background:var(--card);border-radius:12px;padding:10px;text-align:left;border:2px solid transparent}
.ftile.on{border-color:var(--acc)}
.ftile .n{font-size:13px;color:var(--muted)}
.ftile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:2px 0}
.ftile b sup{font-size:12px}
.ftile .r{font-size:12px;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 32px));background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .inner{padding:20px}
dialog h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.small{font-size:13px;color:var(--muted)}
.small a{color:var(--acc)}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ptr"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div></div>

<header>
  <div>
    <h1>Tankpreise</h1>
    <div class="sub" id="stand">Uhingen &amp; Umgebung</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="btnFetch" aria-label="Jetzt neu abrufen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<div class="seg" id="seg">
  <button data-f="e5">Super E5</button>
  <button data-f="e10">Super E10</button>
  <button data-f="diesel">Diesel</button>
</div>

<main id="main"><div class="empty">Lade Daten …</div></main>

<div id="detail" aria-hidden="true"><div class="wrap" id="detailBody"></div></div>

<dialog id="dlg">
  <form method="dialog" class="inner">
    <h3>Einstellungen</h3>
    <p class="small">Damit der Knopf <b>„Jetzt abrufen“</b> funktioniert, braucht die App einmalig einen GitHub-Zugangsschlüssel.
      Er wird nur auf diesem iPhone gespeichert.
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Schlüssel erstellen</a>
      (Repository auswählen → Berechtigung <i>Actions: Read and write</i>).</p>
    <label for="inRepo">Repository (Besitzer/Name)</label>
    <input id="inRepo" placeholder="benutzer/tankpreise" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="inToken">GitHub-Zugangsschlüssel</label>
    <input id="inToken" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="actions">
      <button class="btn secondary" value="cancel">Abbrechen</button>
      <button class="btn" value="save" id="btnSave">Speichern</button>
    </div>
    <div class="actions">
      <button class="btn secondary block" value="report" id="btnReport" type="button">Wochenreport jetzt erstellen</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const FUELS = { e5: "Super E5", e10: "Super E10", diesel: "Diesel" };
  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let fuel = store.get("fuel", "e5");
  let onlyOpen = store.get("onlyOpen", "0") === "1";
  let sortBy = store.get("sortBy", "price");
  let latest = null, summary = null, reports = [], history = null, detailId = null;

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const CHEV = `<svg class="chev" width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
  const NAV = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3a1 1 0 0 0-1.1-.2l-18 8a1 1 0 0 0 .1 1.9l7.4 2 2 7.4a1 1 0 0 0 1.9.1l8-18a1 1 0 0 0-.3-1.2z"/></svg>`;

  // 1.759 -> "1,75<sup>9</sup>"
  const price = (v) => {
    if (v == null) return "–";
    const s = v.toFixed(3).replace(".", ",");
    return `${s.slice(0, -1)}<sup>${s.slice(-1)}</sup>`;
  };
  const eur = (v) => v == null ? "–" : v.toFixed(3).replace(".", ",") + " €";
  const ct = (v) => (v > 0.0005 ? "+" : v < -0.0005 ? "−" : "±") + Math.abs(v * 100).toFixed(1).replace(".", ",") + " ct";
  const km = (d) => d == null ? "" : d.toFixed(1).replace(".", ",") + " km";
  const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const fmtTime = (d) => d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const ago = (iso) => {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "gerade eben";
    if (m < 60) return `vor ${m} Min.`;
    const h = Math.round(m / 60);
    return h < 24 ? `vor ${h} Std.` : fmtTime(new Date(iso));
  };
  const toast = (msg, ms = 3500) => {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); if (ms) toast._t = setTimeout(() => t.classList.remove("show"), ms);
  };

  // ---- Route mit Google Maps: App, falls installiert, sonst Google Maps im Browser
  function openRoute(s) {
    const dest = s.lat && s.lng ? `${s.lat},${s.lng}` : `${s.street}, ${s.place}`;
    const web = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
    const app = `comgooglemaps://?daddr=${encodeURIComponent(dest)}&directionsmode=driving`;
    let left = false;
    const onHide = () => { left = true; };
    document.addEventListener("visibilitychange", onHide, { once: true });
    location.href = app;
    setTimeout(() => {
      document.removeEventListener("visibilitychange", onHide);
      if (!left && !document.hidden) window.open(web, "_blank") || (location.href = web);
    }, 1200);
  }

  async function getJSON(path) {
    const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function load() {
    const [l, s, r] = await Promise.allSettled([getJSON("data/latest.json"), getJSON("data/summary.json"), getJSON("data/reports.json")]);
    latest = l.value || null; summary = s.value || null; reports = r.value || [];
    history = null;
    render();
    if (detailId) renderDetail();
  }
  async function loadHistory() {
    if (!history) { try { history = await getJSON("data/history.json"); } catch { history = { ts: [], stations: {} }; } }
    return history;
  }

  const byId = (id) => latest?.stations?.find((s) => s.id === id);
  const hasPrice = (s, f = fuel) => s.open && s[f] != null;

  function render() {
    document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.f === fuel));
    $("#stand").textContent = latest?.updated ? `Uhingen & Umgebung\nStand ${ago(latest.updated)}` : "Uhingen & Umgebung";
    const main = $("#main");
    if (!latest?.stations?.length) {
      main.innerHTML = `<div class="card empty">Noch keine Daten vorhanden.<br>Der erste Abruf läuft zur nächsten vollen Stunde – oder tippe oben auf ↻.</div>` + reportsHtml();
      return;
    }
    const sum = summary?.fuels?.[fuel];
    const withPrice = latest.stations.filter((s) => hasPrice(s)).sort((a, b) => a[fuel] - b[fuel] || a.dist - b.dist);
    const others = latest.stations.filter((s) => !hasPrice(s)).sort((a, b) => a.dist - b.dist);
    const best = withPrice[0];
    const avgNow = mean(withPrice.map((s) => s[fuel]));
    let h = "";

    if (best) {
      h += `<div class="card hero">
        <div class="label">Am günstigsten gerade · ${FUELS[fuel]}</div>
        <div class="price">${price(best[fuel])} €</div>
        <div class="where">${esc(best.brand)} · ${esc(best.place)}</div>
        <div class="sub">${esc(best.street)} · ${km(best.dist)}</div>
        <div class="row">
          ${withPrice.length > 1 ? `<span class="pill good">${ct(best[fuel] - avgNow)} unter Ø der Umgebung</span>` : ""}
          ${sum?.trend != null ? `<span class="pill ${sum.trend > 0 ? "bad" : "good"}">Woche ${ct(sum.trend)}</span>` : ""}
        </div>
        <div class="row two">
          <button class="btn" data-route="${esc(best.id)}">${NAV} Route</button>
          <button class="btn secondary" data-detail="${esc(best.id)}">Details</button>
        </div>
      </div>`;
    }

    if (sum && sum.hour_avg) {
      const hNow = new Date().getHours();
      const devNow = sum.hour_avg[String(hNow)];
      const bh = sum.best_hour;
      let verdict = "";
      if (devNow != null) {
        verdict = devNow <= sum.hour_avg[String(bh)] + 0.01
          ? "Jetzt ist eine gute Zeit zum Tanken."
          : devNow > 0.01
            ? `Jetzt (${hNow} Uhr) ist es typischerweise ${ct(devNow)} teurer als im Tagesmittel – wenn möglich warten.`
            : `Jetzt (${hNow} Uhr) liegt der Preis meist etwa im Tagesmittel.`;
      }
      h += `<div class="card tip"><div class="emoji">💡</div><div>
        <b>Beste Tankzeit: ${bh}–${bh + 1} Uhr</b> (${ct(sum.hour_avg[String(bh)])} ggü. Tagesmittel)<br>
        <span class="sub">${verdict} Am teuersten: ${sum.worst_hour}–${sum.worst_hour + 1} Uhr.
        ${sum.best_wd != null ? `Günstigster Wochentag: ${WD[sum.best_wd]}.` : ""}</span></div></div>`;
    }

    let list = [...withPrice, ...(onlyOpen ? [] : others)];
    if (sortBy === "dist") list = [...list].sort((a, b) => a.dist - b.dist);
    h += `<h2>Tankstellen <span class="sub">${withPrice.length} mit Preis</span></h2>
      <div class="chips">
        <button class="chip ${sortBy === "price" ? "on" : ""}" data-sort="price">Nach Preis</button>
        <button class="chip ${sortBy === "dist" ? "on" : ""}" data-sort="dist">Nach Entfernung</button>
        <button class="chip ${onlyOpen ? "on" : ""}" data-open>Nur geöffnete</button>
      </div><div class="list">`;
    for (const s of list) {
      const has = hasPrice(s);
      const d = has && best ? s[fuel] - best[fuel] : null;
      h += `<button class="item ${has ? "" : "closed"} ${s === best ? "best" : ""}" data-detail="${esc(s.id)}">
        <div class="info"><div class="name">${esc(s.brand)}</div>
          <div class="addr">${km(s.dist)} · ${esc(s.place)}, ${esc(s.street)}</div></div>
        <div class="p">${has ? `<b>${price(s[fuel])}</b><div class="d">${d ? ct(d) : "günstigste"}</div>` : `<div class="d">${s.open ? "kein " + FUELS[fuel] : "geschlossen"}</div>`}</div>
        ${CHEV}</button>`;
    }
    if (!list.length) h += `<div class="empty">Gerade hat keine Tankstelle geöffnet.</div>`;
    h += `</div>`;

    if (sum) {
      h += `<h2>Letzte 7 Tage</h2>
        <div class="stats">
          <div class="card"><span class="sub">Ø Preis</span><b>${eur(sum.mean)}</b></div>
          <div class="card"><span class="sub">Tiefstpreis</span><b style="color:var(--good)">${eur(sum.min)}</b>
            <span class="sub">${esc(sum.min_station.split(",")[0])}</span></div>
        </div>
        <div class="card"><div class="sub" style="margin-bottom:6px">Durchschnittspreis im Verlauf</div>${lineChart(sum.series.map(([t, v]) => [new Date(t).getTime(), v]))}</div>
        <div class="card"><div class="sub" style="margin-bottom:6px">Abweichung nach Uhrzeit (grün = günstiger)</div>${hourChart(sum.hour_avg, sum.best_hour)}</div>`;
      if (sum.ranking?.length) {
        h += `<h2>Günstigste im Wochenschnitt</h2><div class="list">` + sum.ranking.map((r, i) => `<button class="item" ${r.id ? `data-detail="${esc(r.id)}"` : ""}><div class="info">
          <div class="name">${i + 1}. ${esc(r.label.split(",")[0])}</div><div class="addr">${esc(r.label.split(",").slice(1).join(",").trim())}</div></div>
          <div class="p"><b>${price(r.mean)}</b><div class="d">Ø Woche</div></div>${r.id ? CHEV : ""}</button>`).join("") + `</div>`;
      }
    }
    h += reportsHtml();
    h += `<p class="sub" style="text-align:center;margin-top:24px">Daten: Tankerkönig / MTS-K (CC BY 4.0)</p>`;
    main.innerHTML = h;
  }

  function reportsHtml() {
    if (!reports.length) return "";
    return `<h2>Wochenreports</h2><div class="list">` + reports.map((r) =>
      `<a class="item" href="${esc(r.file)}"><div class="info"><div class="name">${esc(r.title)}</div></div>${CHEV}</a>`).join("") + `</div>`;
  }

  // ---- Detailansicht einer Tankstelle
  function openDetail(id) {
    if (!byId(id)) return;
    detailId = id;
    if (window.history.state?.d !== id) try { window.history.pushState({ d: id }, ""); } catch {}
    $("#detail").classList.add("open"); $("#detail").setAttribute("aria-hidden", "false");
    document.body.classList.add("lock");
    $("#detail").scrollTop = 0;
    renderDetail();
  }
  function closeDetail(fromPop) {
    if (!detailId) return;
    detailId = null;
    $("#detail").classList.remove("open"); $("#detail").setAttribute("aria-hidden", "true");
    document.body.classList.remove("lock");
    if (!fromPop) try { window.history.back(); } catch {}
  }
  window.addEventListener("popstate", () => closeDetail(true));

  async function renderDetail() {
    const s = byId(detailId);
    if (!s) return;
    const body = $("#detailBody");
    const tiles = Object.keys(FUELS).map((f) => {
      const all = latest.stations.filter((x) => hasPrice(x, f)).sort((a, b) => a[f] - b[f]);
      const rank = all.findIndex((x) => x.id === s.id) + 1;
      return `<button class="ftile ${f === fuel ? "on" : ""}" data-fuel="${f}"><div class="n">${FUELS[f]}</div>
        <b>${hasPrice(s, f) ? price(s[f]) : "–"}</b>
        <div class="r">${rank ? `Platz ${rank}/${all.length}` : s.open ? "nicht angeboten" : "geschlossen"}</div></button>`;
    }).join("");
    const all = latest.stations.filter((x) => hasPrice(x));
    const avgNow = mean(all.map((x) => x[fuel]));
    const diffNow = hasPrice(s) ? s[fuel] - avgNow : null;
    body.innerHTML = `
      <button class="back" id="btnBack"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Zurück</button>
      <div class="dhead"><h1>${esc(s.brand)}</h1>
        <div class="sub">${esc(s.street)}, ${esc(s.place)} · ${km(s.dist)} von Uhingen</div>
        <div class="row" style="margin-top:8px">
          <span class="pill ${s.open ? "good" : "neutral"}">${s.open ? "Geöffnet" : "Geschlossen"}</span>
          ${diffNow != null && all.length > 1 ? `<span class="pill ${diffNow > 0.0005 ? "bad" : "good"}">${ct(diffNow)} ggü. Ø jetzt</span>` : ""}
        </div></div>
      <div class="fuelgrid">${tiles}</div>
      <button class="btn block" data-route="${esc(s.id)}">${NAV} Route mit Google Maps</button>
      <div id="dstats"><div class="empty">Lade Verlauf …</div></div>
      <p class="sub" style="text-align:center;margin-top:24px">Stand ${ago(latest.updated)}</p>`;

    const hist = await loadHistory();
    if (detailId !== s.id) return;
    const own = hist.stations?.[s.id]?.[fuel] || [];
    const ts = hist.ts.map((t) => new Date(t).getTime());
    const regAvg = ts.map((_, i) => mean(Object.values(hist.stations).map((x) => x[fuel]?.[i]).filter((v) => v != null)));
    const pts = ts.map((t, i) => [t, own[i]]).filter((p) => p[1] != null);
    const regPts = ts.map((t, i) => [t, regAvg[i]]).filter((p) => p[1] != null);
    let h = "";
    if (pts.length < 2) {
      h = `<div class="card empty" style="margin-top:12px">Für diese Tankstelle gibt es noch zu wenige ${FUELS[fuel]}-Daten. Nach ein paar Stunden erscheint hier der Verlauf.</div>`;
    } else {
      const vals = pts.map((p) => p[1]);
      const avg = mean(vals);
      const regMean = mean(pts.map((p) => regAvg[ts.indexOf(p[0])]).filter((v) => v != null));
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const loAt = pts.find((p) => p[1] === lo)[0];
      let changes = 0; for (let i = 1; i < vals.length; i++) if (Math.abs(vals[i] - vals[i - 1]) > 1e-9) changes++;
      // Tageszeit-Profil: Abweichung vom jeweiligen Tagesmittel der Tankstelle
      const days = {};
      pts.forEach(([t, v]) => { const k = new Date(t).toDateString(); (days[k] ||= []).push(v); });
      const dayMean = Object.fromEntries(Object.entries(days).map(([k, a]) => [k, mean(a)]));
      const byHour = {};
      pts.forEach(([t, v]) => { const d = new Date(t); (byHour[d.getHours()] ||= []).push(v - dayMean[d.toDateString()]); });
      const hourAvg = Object.fromEntries(Object.entries(byHour).map(([k, a]) => [k, mean(a)]));
      const hours = Object.keys(hourAvg).map(Number);
      const bestH = hours.length ? hours.reduce((a, b) => hourAvg[a] <= hourAvg[b] ? a : b) : null;
      const span = (pts[pts.length - 1][0] - pts[0][0]) / 864e5;
      h += `<h2>${FUELS[fuel]} · ${span >= 6 ? "letzte 7 Tage" : "bisher gesammelt"}</h2>
        <div class="stats">
          <div class="card"><span class="sub">Ø Preis hier</span><b>${eur(avg)}</b>
            <span class="pill ${avg - regMean > 0.0005 ? "bad" : "good"}">${ct(avg - regMean)} ggü. Ø</span></div>
          <div class="card"><span class="sub">Tiefstpreis</span><b style="color:var(--good)">${eur(lo)}</b>
            <span class="sub">${fmtTime(new Date(loAt))}</span></div>
          <div class="card"><span class="sub">Höchstpreis</span><b style="color:var(--bad)">${eur(hi)}</b>
            <span class="sub">${hi - lo < 0.0005 ? "Preis unverändert" : "Spanne " + ct(hi - lo).replace("+", "")}</span></div>
          <div class="card"><span class="sub">Günstigste Uhrzeit</span><b>${bestH != null && Object.keys(days).length > 1 ? `${bestH}–${bestH + 1} Uhr` : "–"}</b>
            <span class="sub">${changes} Preisänderungen beobachtet</span></div>
        </div>
        <div class="card"><div class="sub" style="margin-bottom:6px">Preisverlauf</div>
          ${lineChart(pts, regPts)}
          <div class="legend"><span><i></i>${esc(s.brand)}</span><span><i class="dash"></i>Ø Umgebung</span></div></div>`;
      if (Object.keys(days).length > 1)
        h += `<div class="card"><div class="sub" style="margin-bottom:6px">Abweichung nach Uhrzeit an dieser Tankstelle</div>${hourChart(hourAvg, bestH)}</div>`;
    }
    $("#dstats").innerHTML = h;
  }

  // ---- Diagramme
  function lineChart(pts, ref) {
    if (!pts || pts.length < 2) return `<div class="sub">Noch zu wenige Daten.</div>`;
    const W = 340, H = 150, L = 38, R = 6, T = 8, B = 20;
    const all = [...pts, ...(ref || [])];
    const t0 = Math.min(...all.map((p) => p[0])), t1 = Math.max(...all.map((p) => p[0]));
    let lo = Math.min(...all.map((p) => p[1])), hi = Math.max(...all.map((p) => p[1]));
    if (hi - lo < 0.01) { lo -= 0.005; hi += 0.005; }
    const X = (t) => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
    const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    let g = "";
    for (let i = 0; i <= 2; i++) {
      const v = lo + (hi - lo) * i / 2, y = Y(v);
      g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 4}" y="${y + 4}" text-anchor="end">${v.toFixed(2).replace(".", ",")}</text>`;
    }
    const multiDay = t1 - t0 > 864e5 * 1.2;
    if (multiDay) {
      const d0 = new Date(t0); d0.setHours(24, 0, 0, 0);
      for (let d = d0; d.getTime() < t1; d = new Date(d.getTime() + 864e5)) {
        const x = X(d.getTime());
        g += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/><text x="${x + 3}" y="${H - 6}">${WD[(d.getDay() + 6) % 7]}</text>`;
      }
    } else {
      const d0 = new Date(t0); d0.setMinutes(0, 0, 0);
      const step = Math.max(1, Math.ceil((t1 - t0) / 36e5 / 6));
      for (let d = new Date(d0.getTime() + 36e5); d.getTime() < t1; d = new Date(d.getTime() + step * 36e5)) {
        const x = X(d.getTime());
        g += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/><text x="${x}" y="${H - 6}" text-anchor="middle">${d.getHours()} Uhr</text>`;
      }
    }
    const path = (p) => p.map(([t, v]) => `${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${ref && ref.length > 1 ? `<polyline class="ln2" points="${path(ref)}"/>` : ""}<polyline class="ln" points="${path(pts)}"/></svg>`;
  }

  function hourChart(hourAvg, bestHour) {
    const W = 340, H = 130, L = 6, R = 6, T = 8, B = 18;
    const vals = Array.from({ length: 24 }, (_, i) => hourAvg[String(i)] ?? null);
    const m = Math.max(0.001, ...vals.filter((v) => v != null).map(Math.abs));
    const zero = T + (H - T - B) / 2, sc = (H - T - B) / 2 / m, bw = (W - L - R) / 24, now = new Date().getHours();
    let g = `<line class="gl" x1="${L}" x2="${W - R}" y1="${zero}" y2="${zero}"/>`;
    vals.forEach((v, i) => {
      const x = L + i * bw + bw * 0.15;
      if (v != null) {
        const h = Math.max(Math.abs(v) * sc, 1), y = v > 0 ? zero - h : zero;
        const cls = i === bestHour ? "bar-best" : v > 0 ? "bar-up" : "bar-down";
        g += `<rect class="${cls} ${i === now ? "bar-now" : ""}" x="${x}" y="${y}" width="${bw * 0.7}" height="${h}" rx="1.5"/>`;
      }
      if (i % 3 === 0) g += `<text x="${x + bw * 0.35}" y="${H - 4}" text-anchor="middle">${i}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  }

  // ---- GitHub-Workflow starten (Knopf "Jetzt abrufen")
  function defaultRepo() {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return m && seg ? `${m[1]}/${seg}` : "";
  }
  async function dispatch(aktion) {
    const repo = store.get("repo", defaultRepo()), token = store.get("token", "");
    if (!repo || !token) { openSettings(); return; }
    const btn = $("#btnFetch svg"); btn.classList.add("spin");
    try {
      const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/tankpreise.yml/dispatches`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
        body: JSON.stringify({ ref: "main", inputs: { aktion } }),
      });
      if (r.status !== 204) throw new Error(r.status === 401 || r.status === 403 ? "Schlüssel ungültig oder ohne Berechtigung" : `GitHub-Fehler ${r.status}`);
      toast(aktion === "report" ? "Wochenreport wird erstellt – dauert ca. 1–2 Minuten." : "Abruf gestartet – neue Preise in ca. 1–2 Minuten.", 0);
      await waitForUpdate(aktion === "report" ? "summary.json" : "latest.json");
    } catch (e) {
      toast("Fehler: " + e.message, 6000);
    } finally { btn.classList.remove("spin"); }
  }
  async function waitForUpdate(file) {
    const before = (file === "latest.json" ? latest : summary)?.updated;
    for (let i = 0; i < 24; i++) {
      await new Promise((r) => setTimeout(r, 15000));
      try {
        const d = await getJSON("data/" + file);
        if (d.updated !== before) { await load(); toast("Aktualisiert ✓"); return; }
      } catch {}
    }
    toast("Dauert länger als erwartet – später neu laden.", 5000);
  }

  function openSettings() {
    $("#inRepo").value = store.get("repo", defaultRepo());
    $("#inToken").value = store.get("token", "");
    $("#dlg").showModal();
  }
  $("#dlg").addEventListener("close", () => {
    if ($("#dlg").returnValue === "save") {
      store.set("repo", $("#inRepo").value.trim());
      store.set("token", $("#inToken").value.trim());
      toast("Gespeichert.");
    }
  });
  $("#btnReport").addEventListener("click", () => {
    store.set("repo", $("#inRepo").value.trim());
    store.set("token", $("#inToken").value.trim());
    $("#dlg").close();
    dispatch("report");
  });
  $("#btnSettings").addEventListener("click", openSettings);
  $("#btnFetch").addEventListener("click", () => dispatch("abrufen"));
  $("#seg").addEventListener("click", (e) => {
    const f = e.target.dataset?.f; if (!f) return;
    fuel = f; store.set("fuel", f); render();
  });

  // Klicks in Liste und Detailansicht
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-route],[data-detail],[data-fuel],[data-sort],[data-open],#btnBack");
    if (!el) return;
    if (el.id === "btnBack") return closeDetail();
    if (el.dataset.route) return openRoute(byId(el.dataset.route));
    if (el.dataset.detail) return openDetail(el.dataset.detail);
    if (el.dataset.fuel) { fuel = el.dataset.fuel; store.set("fuel", fuel); render(); return renderDetail(); }
    if (el.dataset.sort) { sortBy = el.dataset.sort; store.set("sortBy", sortBy); return render(); }
    if (el.hasAttribute("data-open")) { onlyOpen = !onlyOpen; store.set("onlyOpen", onlyOpen ? "1" : "0"); return render(); }
  });

  // Wischen vom linken Rand schließt die Detailansicht
  let sx = null, sy = null;
  $("#detail").addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX < 40 ? t.clientX : null; sy = t.clientY; }, { passive: true });
  $("#detail").addEventListener("touchend", (e) => {
    if (sx == null) return; const t = e.changedTouches[0];
    if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) closeDetail();
    sx = null;
  }, { passive: true });

  // Ziehen nach unten zum Aktualisieren
  const ptr = $("#ptr"); let py = null, pull = 0, busy = false;
  window.addEventListener("touchstart", (e) => { py = !detailId && window.scrollY <= 0 && !busy ? e.touches[0].clientY : null; pull = 0; }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (py == null) return;
    pull = Math.max(0, e.touches[0].clientY - py);
    ptr.style.opacity = Math.min(1, pull / 70);
    ptr.firstElementChild.style.transform = `translateY(${Math.min(pull, 90) / 2}px) rotate(${pull * 3}deg)`;
  }, { passive: true });
  window.addEventListener("touchend", async () => {
    if (py == null) return; py = null;
    if (pull > 70) {
      busy = true; ptr.querySelector("svg").classList.add("spin");
      await load().catch(() => {});
      ptr.querySelector("svg").classList.remove("spin"); busy = false;
    }
    ptr.style.opacity = 0; ptr.firstElementChild.style.transform = "";
  });

  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
