name: Tankpreise

on:
  schedule:
    - cron: "1,16,31,46 * * * *"   # alle 15 Minuten Preise abrufen (:01, :16, :31, :46)
    - cron: "37 4 * * 1"             # montags früh (06:37 Sommer- / 05:37 Winterzeit): Wochenreport
  workflow_dispatch:         # manueller Start, z. B. über den Knopf in der iPhone-App
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options: [abrufen, report]
        default: abrufen

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Europe/Berlin

jobs:
  # Daten abrufen und speichern – bewusst ohne "github-pages"-Umgebung, damit eine hängende
  # Veröffentlichung die Abrufe nicht mehr blockieren kann.
  tankpreise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tankpreise
      cancel-in-progress: false
    outputs:
      public: ${{ steps.repo.outputs.public }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abrufen bzw. Wochenreport erstellen
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "37 4 * * 1" ] || [ "${{ inputs.aktion }}" = "report" ]; then
            python tankpreise.py report
          else
            python tankpreise.py fetch
            python tankpreise.py export
          fi

      - name: Daten im Repository speichern
        run: |
          git config user.name "tankpreise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -q -m "Tankpreise $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((2**i)); done
          exit 1

      # Webseite nur bei öffentlichem Repository; bei privatem lädt die App die Daten über die GitHub-API
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api repos/${{ github.repository }} --jq '.private == false')" >> "$GITHUB_OUTPUT"
      - if: steps.repo.outputs.public == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Webseite veröffentlichen. Eigene Warteschlange: Eine neuere Veröffentlichung ersetzt eine
  # wartende oder hängende ältere.
  pages:
    needs: tankpreise
    if: needs.tankpreise.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
