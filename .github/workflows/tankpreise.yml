name: Tankpreise

on:
  schedule:
    # Versuch ab 08.11.2026: viermal pro Stunde zu unrunden Minuten statt alle 5 Minuten. GitHub startete zuletzt nur noch
    # etwa 4 von 288 geplanten Läufen am Tag (vorher 28); die dichte Taktung wird offenbar gedrosselt. Auswertung nach 24 Stunden.
    - cron: "7,22,37,52 * * * *"
    - cron: "37 4 * * 1"             # montags früh (06:37 Sommer- / 05:37 Winterzeit): Wochenreport
  workflow_dispatch:         # manueller Start, z. B. über den Knopf in der iPhone-App
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options: [abrufen, report]
        default: abrufen

permissions:
  contents: write

env:
  TZ: Europe/Berlin

jobs:
  tankpreise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tankpreise
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # immer der neueste Stand: ein wartender Lauf (concurrency) startet sonst mit dem Stand von seiner Erstellung und scheitert beim Speichern

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Aufbereitete App-Daten liegen auf dem Zweig „app-daten“ (ein Stand ohne Verlauf). Für fortlaufende
      # Dateien (Monatsverläufe, Wochenreports) den letzten Stand von dort holen.
      - name: Letzten Stand der App-Daten holen
        run: |
          if git fetch -q --depth=1 origin app-daten; then git archive FETCH_HEAD docs | tar -x; fi

      - name: Preise abrufen
        id: fetch
        if: github.event.schedule != '37 4 * * 1' && inputs.aktion != 'report'
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        # geplante Läufe: frühestens 10 Minuten nach dem letzten Abruf (Verspätungen von GitHub sollen keinen Lauf verschlucken); Knopf in der App: nach 5 Minuten
        run: python tankpreise.py fetch --min-interval ${{ github.event_name == 'schedule' && 10 || 5 }}

      - name: Auswerten (und ausgefallenen Wochenreport nachholen)
        if: steps.fetch.outputs.fetched == 'true'
        run: python tankpreise.py export --ensure-report

      - name: Wochenreport erstellen
        if: github.event.schedule == '37 4 * * 1' || inputs.aktion == 'report'
        run: python tankpreise.py report

      - name: Rohdaten im Repository speichern (main)
        if: steps.fetch.outputs.fetched == 'true' || github.event.schedule == '37 4 * * 1' || inputs.aktion == 'report'
        run: |
          git config user.name "tankpreise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "Tankpreise $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((2**i)); done
          exit 1

      # Ein einzelner Commit ohne Vorgänger, per Force-Push: Der Zweig enthält immer nur den aktuellen Stand,
      # alte Stände werden von GitHub aufgeräumt – das Repository wächst dadurch nicht.
      - name: App-Daten veröffentlichen (Zweig app-daten)
        if: steps.fetch.outputs.fetched == 'true' || github.event.schedule == '37 4 * * 1' || inputs.aktion == 'report'
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/app-index"
          git add -f docs/data $([ -d docs/reports ] && echo docs/reports)
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "App-Daten $(date '+%Y-%m-%d %H:%M')")
          for i in 1 2 3; do git push -q -f origin "$commit:refs/heads/app-daten" && exit 0; sleep $((2**i)); done
          exit 1

  # Die Webseite dieses Repositorys wird nicht mehr bei jedem Abruf veröffentlicht: Die App
  # (Schwabensprit-app) liest die Daten direkt aus dem Repository. Die alte Adresse leitet über
  # weiterleitung.yml auf die App um.
