name: Tankpreise

on:
  schedule:
    # Alle 5 Minuten starten, abgerufen wird aber höchstens alle ~15 Minuten (Sperre im Programm).
    # GitHub lässt geplante Läufe bei hoher Last gern aus – so fängt der nächste Termin das auf.
    - cron: "1-59/5 * * * *"
    - cron: "37 4 * * 1"             # montags früh (06:37 Sommer- / 05:37 Winterzeit): Wochenreport
  workflow_dispatch:         # manueller Start, z. B. über den Knopf in der iPhone-App
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options: [abrufen, report]
        default: abrufen

permissions:
  contents: write

env:
  TZ: Europe/Berlin

jobs:
  tankpreise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tankpreise
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preise abrufen
        id: fetch
        if: github.event.schedule != '37 4 * * 1' && inputs.aktion != 'report'
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        # geplante Läufe: frühestens 13 Minuten nach dem letzten Abruf; Knopf in der App: nach 5 Minuten
        run: python tankpreise.py fetch --min-interval ${{ github.event_name == 'schedule' && 13 || 5 }}

      - name: Auswerten (und ausgefallenen Wochenreport nachholen)
        if: steps.fetch.outputs.fetched == 'true'
        run: python tankpreise.py export --ensure-report

      - name: Wochenreport erstellen
        if: github.event.schedule == '37 4 * * 1' || inputs.aktion == 'report'
        run: python tankpreise.py report

      - name: Daten im Repository speichern
        if: steps.fetch.outputs.fetched == 'true' || github.event.schedule == '37 4 * * 1' || inputs.aktion == 'report'
        run: |
          git config user.name "tankpreise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -q -m "Tankpreise $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((2**i)); done
          exit 1

  # Die Webseite dieses Repositorys wird nicht mehr bei jedem Abruf veröffentlicht: Die App
  # (Schwabensprit-app) liest die Daten direkt aus dem Repository. Die alte Adresse leitet über
  # weiterleitung.yml auf die App um.
